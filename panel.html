<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión y Carga de Noticias</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Encode Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Encode Sans', 'sans-serif'],
                    },
                    colors: {
                        argBlue: '#0077B6',
                        argLightBlue: '#38A8DF',
                        argSun: '#FFB703',
                        argSunDark: '#F4A261',
                        argTeal: '#2A9D8F',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Encode Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 flex flex-col justify-between">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Dynamic content via JS -->
    </div>

    <!-- Page Footer -->
    <footer class="bg-slate-900 text-slate-400 py-4 px-6 text-center text-xs border-t border-slate-800 mt-auto">
        Sistema Federal de Carga y Gestión de Noticias &bull; Versión 3.0 Real-Time &bull; Conectado en Tiempo Real para Multiusuarios
    </footer>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration fallback for local/standalone run
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "demo-key",
                authDomain: "demo-app.firebaseapp.com",
                projectId: "demo-app",
                storageBucket: "demo-app.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'news-management-app-v3';

        let app, db, auth;
        let isFirebaseActive = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            isFirebaseActive = true;
        } catch(e) {
            console.warn("Firebase initialization skipped or in offline demo mode:", e);
        }

        // --- GLOBAL APP STATE ---
        window.appState = {
            currentView: 'login', // 'login', 'dashboard', 'create_media', 'create_note', 'create_user', 'manage_users', 'edit_user'
            session: JSON.parse(localStorage.getItem('news_app_session')) || null,
            users: JSON.parse(localStorage.getItem('news_app_users')) || [
                { id: '1', username: 'admin', pass: 'admin123', role: 'Administrador', name: 'Carlos Administrador' },
                { id: '2', username: 'editor', pass: 'editor123', role: 'Editor', name: 'Sofía Editora' },
                { id: '3', username: 'auditor', pass: 'auditor123', role: 'Auditor', name: 'Martín Auditor' }
            ],
            media: JSON.parse(localStorage.getItem('news_app_media')) || [
                { id: '1', name: 'Clarín', type: 'Digital', origin: 'Buenos Aires', priority: 'Alta', logo: 'https://placehold.co/100x100/0077B6/ffffff?text=CL' },
                { id: '2', name: 'La Nación', type: 'Impreso', origin: 'Buenos Aires', priority: 'Alta', logo: 'https://placehold.co/100x100/2A9D8F/ffffff?text=LN' },
                { id: '3', name: 'Infobae', type: 'Portal de noticias', origin: 'CABA', priority: 'Alta', logo: 'https://placehold.co/100x100/FFB703/ffffff?text=IB' },
                { id: '4', name: 'Página 12', type: 'Impreso', origin: 'Buenos Aires', priority: 'Media', logo: 'https://placehold.co/100x100/334155/ffffff?text=P12' },
                { id: '5', name: 'TN (Todo Noticias)', type: 'TV', origin: 'CABA', priority: 'Alta', logo: 'https://placehold.co/100x100/ef4444/ffffff?text=TN' },
                { id: '6', name: 'Cadena 3', type: 'Radio', origin: 'Córdoba', priority: 'Media', logo: 'https://placehold.co/100x100/f97316/ffffff?text=C3' }
            ],
            news: JSON.parse(localStorage.getItem('news_app_news')) || [],
            currentPage: 1,
            itemsPerPage: 30,
            expandedRowId: null,
            editingUserId: null,
            mediaSearchQuery: '',
            mediaSelectQuery: '',
            isMediaDropdownOpen: false,
            filters: {
                media: '',
                status: '',
                priority: '',
                search: ''
            }
        };

        // Seed news if empty
        if (!window.appState.news || window.appState.news.length === 0) {
            const seedNews = [];
            const sampleTitles = [
                "Nuevas inversiones tecnológicas anunciadas para el norte argentino",
                "Avances en el proyecto de desarrollo sustentable e hidrocarburos",
                "Récord de exportaciones agroindustriales durante el último trimestre",
                "Inauguración de polo científico en la provincia de Córdoba",
                "Plan federal de conectividad alcanza más de 200 municipios",
                "Encuentro internacional de periodismo y medios digitales"
            ];
            for (let i = 1; i <= 32; i++) {
                const med = window.appState.media[(i - 1) % window.appState.media.length];
                const day = String((i % 28) + 1).padStart(2, '0');
                seedNews.push({
                    id: `note-${i}`,
                    date: `2026-10-${day}`,
                    time: `${String((i * 2) % 24).padStart(2, '0')}:${String((i * 15) % 60).padStart(2, '0')}`,
                    mediaId: med.id,
                    mediaName: med.name,
                    mediaPriority: med.priority,
                    title: `${sampleTitles[(i - 1) % sampleTitles.length]} #${i}`,
                    content: `Contenido completo de la nota informativa número ${i}. Este texto detalla el impacto económico, social y político de las recientes decisiones tomadas por los organismos competentes. Muestra el desarrollo completo de la noticia para que todos los usuarios puedan analizar las implicancias a nivel federal.`,
                    link: `https://www.${med.name.toLowerCase().replace(/\s+/g, '')}.com/noticia-${i}`,
                    image: i % 2 === 0 ? `https://placehold.co/800x500/0077B6/ffffff?text=Noticia+Nro+${i}` : '',
                    author: i % 2 === 0 ? 'admin' : 'auditor',
                    status: i % 3 === 0 ? 'Pendiente' : 'Publicado'
                });
            }
            window.appState.news = seedNews;
            localStorage.setItem('news_app_news', JSON.stringify(seedNews));
        }

        // --- FIREBASE SYNC IMPLEMENTATION ---
        async function initFirebaseSync() {
            if (!isFirebaseActive) return;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Listen to Firestore News Collection
                const newsCol = collection(db, 'artifacts', appId, 'public', 'data', 'news');
                onSnapshot(newsCol, (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudNews = snapshot.docs.map(doc => doc.data());
                        window.appState.news = cloudNews;
                        localStorage.setItem('news_app_news', JSON.stringify(cloudNews));
                        if (window.appState.currentView === 'dashboard') window.renderApp();
                    }
                }, (err) => console.warn("Firestore news listener:", err));

                // Listen to Firestore Media Collection
                const mediaCol = collection(db, 'artifacts', appId, 'public', 'data', 'media');
                onSnapshot(mediaCol, (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudMedia = snapshot.docs.map(doc => doc.data());
                        window.appState.media = cloudMedia;
                        localStorage.setItem('news_app_media', JSON.stringify(cloudMedia));
                        if (window.appState.currentView === 'create_media' || window.appState.currentView === 'create_note') window.renderApp();
                    }
                }, (err) => console.warn("Firestore media listener:", err));

                // Listen to Firestore Users Collection
                const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');
                onSnapshot(usersCol, (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudUsers = snapshot.docs.map(doc => doc.data());
                        window.appState.users = cloudUsers;
                        localStorage.setItem('news_app_users', JSON.stringify(cloudUsers));
                    }
                }, (err) => console.warn("Firestore users listener:", err));

            } catch (err) {
                console.warn("Sync init failed, falling back to local memory mode:", err);
            }
        }

        window.saveItemCloud = async function(collectionName, item) {
            // Local sync
            if (collectionName === 'news') {
                const idx = window.appState.news.findIndex(x => String(x.id) === String(item.id));
                if (idx !== -1) window.appState.news[idx] = item;
                else window.appState.news.unshift(item);
                localStorage.setItem('news_app_news', JSON.stringify(window.appState.news));
            } else if (collectionName === 'media') {
                const idx = window.appState.media.findIndex(x => String(x.id) === String(item.id));
                if (idx !== -1) window.appState.media[idx] = item;
                else window.appState.media.push(item);
                localStorage.setItem('news_app_media', JSON.stringify(window.appState.media));
            } else if (collectionName === 'users') {
                const idx = window.appState.users.findIndex(x => String(x.id) === String(item.id));
                if (idx !== -1) window.appState.users[idx] = item;
                else window.appState.users.push(item);
                localStorage.setItem('news_app_users', JSON.stringify(window.appState.users));
            }

            // Cloud sync
            if (isFirebaseActive && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, String(item.id));
                    await setDoc(docRef, item);
                } catch (e) {
                    console.error("Cloud save error:", e);
                }
            }
        };

        window.deleteItemCloud = async function(collectionName, itemId) {
            if (collectionName === 'news') {
                window.appState.news = window.appState.news.filter(x => String(x.id) !== String(itemId));
                localStorage.setItem('news_app_news', JSON.stringify(window.appState.news));
            } else if (collectionName === 'users') {
                window.appState.users = window.appState.users.filter(x => String(x.id) !== String(itemId));
                localStorage.setItem('news_app_users', JSON.stringify(window.appState.users));
            }

            if (isFirebaseActive && auth.currentUser) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, String(itemId));
                    await deleteDoc(docRef);
                } catch (e) {
                    console.error("Cloud delete error:", e);
                }
            }
        };

        initFirebaseSync();
    </script>

    <!-- UI Logic Scripts -->
    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-emerald-600 text-white';
            let icon = 'fa-circle-check';
            if (type === 'error' || type === 'rejected') {
                bgClass = 'bg-rose-600 text-white';
                icon = 'fa-circle-xmark';
            } else if (type === 'info') {
                bgClass = 'bg-sky-600 text-white';
                icon = 'fa-circle-info';
            }

            toast.className = `pointer-events-auto flex items-center space-x-3 px-5 py-3 rounded-xl shadow-xl transform transition-all duration-300 translate-y-2 opacity-0 font-medium text-sm ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function setSession(user) {
            window.appState.session = user;
            localStorage.setItem('news_app_session', JSON.stringify(user));
        }

        function logout() {
            setSession(null);
            window.appState.currentView = 'login';
            showToast('Sesión cerrada correctamente', 'info');
            renderApp();
        }

        function navigateTo(view) {
            window.appState.currentView = view;
            window.appState.isMediaDropdownOpen = false;
            window.appState.mediaSelectQuery = '';
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- MAIN RENDER ROUTER ---
        function renderApp() {
            const state = window.appState;
            const app = document.getElementById('app');

            if (!state.session) {
                state.currentView = 'login';
                app.innerHTML = renderLoginScreen();
                bindLoginEvents();
                return;
            }

            switch (state.currentView) {
                case 'login':
                    state.currentView = 'dashboard';
                    app.innerHTML = renderDashboardScreen();
                    bindDashboardEvents();
                    break;
                case 'dashboard':
                    app.innerHTML = renderDashboardScreen();
                    bindDashboardEvents();
                    break;
                case 'create_media':
                    app.innerHTML = renderCreateMediaScreen();
                    bindCreateMediaEvents();
                    break;
                case 'create_note':
                    app.innerHTML = renderCreateNoteScreen();
                    bindCreateNoteEvents();
                    break;
                case 'create_user':
                    app.innerHTML = renderCreateUserScreen();
                    bindCreateUserEvents();
                    break;
                case 'manage_users':
                    app.innerHTML = renderManageUsersScreen();
                    bindManageUsersEvents();
                    break;
                case 'edit_user':
                    app.innerHTML = renderEditUserScreen();
                    bindEditUserEvents();
                    break;
                default:
                    app.innerHTML = renderDashboardScreen();
                    bindDashboardEvents();
            }
        }
        window.renderApp = renderApp;

        // --- NAVBAR HELPER ---
        function renderNavbar() {
            const session = window.appState.session;
            const isAdmin = session.role === 'Administrador';

            return `
                <header class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm sticky top-0 z-30">
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('dashboard')">
                            <div class="w-10 h-10 bg-gradient-to-tr from-argBlue to-argLightBlue text-white rounded-xl flex items-center justify-center font-bold shadow">
                                <i class="fa-solid fa-newspaper text-lg"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight font-heading">Panel Federal de Noticias</h1>
                                <span class="text-xs text-slate-500 font-medium">Usuario: <strong class="text-argBlue">${session.name}</strong> (${session.role})</span>
                            </div>
                        </div>

                        <div class="flex items-center flex-wrap gap-2 justify-center">
                            ${isAdmin ? `
                                <button onclick="navigateTo('create_media')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs flex items-center space-x-1.5 transition">
                                    <i class="fa-solid fa-photo-film text-argTeal"></i>
                                    <span>Crear Medio</span>
                                </button>
                                <button onclick="navigateTo('create_user')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs flex items-center space-x-1.5 transition">
                                    <i class="fa-solid fa-user-plus text-argBlue"></i>
                                    <span>Crear Usuario</span>
                                </button>
                                <button onclick="navigateTo('manage_users')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs flex items-center space-x-1.5 transition">
                                    <i class="fa-solid fa-users-gear text-amber-600"></i>
                                    <span>Administrar Usuarios</span>
                                </button>
                            ` : ''}

                            <!-- Accessible by Admin, Editor AND Auditor -->
                            <button onclick="navigateTo('create_note')" class="px-4 py-2 bg-gradient-to-r from-argTeal to-teal-500 hover:from-teal-700 hover:to-teal-600 text-white rounded-xl font-semibold text-xs flex items-center space-x-1.5 shadow-md shadow-teal-500/20 transition">
                                <i class="fa-solid fa-plus-circle"></i>
                                <span>Cargar Nota</span>
                            </button>

                            <button onclick="logout()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl font-semibold text-xs flex items-center space-x-1 transition ml-2">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span>Salir</span>
                            </button>
                        </div>
                    </div>
                </header>
            `;
        }

        // --- 1. LOGIN SCREEN ---
        function renderLoginScreen() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-sky-950 p-6">
                    <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-argBlue to-argLightBlue text-white rounded-2xl shadow-lg mb-4 text-2xl font-bold">
                                <i class="fa-solid fa-newspaper"></i>
                            </div>
                            <h1 class="text-2xl font-extrabold text-slate-900 font-heading">Panel Federal de Noticias</h1>
                            <p class="text-slate-500 text-sm mt-1">Acceso seguro con control de roles</p>
                        </div>

                        <form id="login-form" class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Usuario</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" id="login-user" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-argBlue" placeholder="ej. admin, editor, auditor">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" id="login-pass" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-argBlue" placeholder="••••••••">
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3 bg-gradient-to-r from-argBlue to-argLightBlue hover:from-sky-700 hover:to-sky-500 text-white font-semibold rounded-xl shadow-lg shadow-sky-500/25 transition">
                                Iniciar Sesión
                            </button>
                        </form>

                        <div class="mt-8 pt-6 border-t border-slate-200 text-center">
                            <p class="text-xs text-slate-500 mb-3 font-medium">Usuarios predeterminados:</p>
                            <div class="flex justify-center gap-2 flex-wrap">
                                <button type="button" onclick="fillLogin('admin', 'admin123')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition">
                                    <i class="fa-solid fa-shield-halved text-argBlue mr-1"></i> Admin
                                </button>
                                <button type="button" onclick="fillLogin('editor', 'editor123')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition">
                                    <i class="fa-solid fa-pen-nib text-argTeal mr-1"></i> Editor
                                </button>
                                <button type="button" onclick="fillLogin('auditor', 'auditor123')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition">
                                    <i class="fa-solid fa-eye text-amber-600 mr-1"></i> Auditor
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.fillLogin = function(u, p) {
            document.getElementById('login-user').value = u;
            document.getElementById('login-pass').value = p;
        };

        function bindLoginEvents() {
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('login-user').value.trim();
                const p = document.getElementById('login-pass').value.trim();
                
                const users = window.appState.users;
                const found = users.find(x => x.username === u && x.pass === p);

                if (found) {
                    setSession(found);
                    showToast(`Bienvenido, ${found.name} (${found.role})`, 'success');
                    navigateTo('dashboard');
                } else {
                    showToast('Usuario o contraseña incorrectos', 'error');
                }
            });
        }

        // --- 2. DASHBOARD SCREEN (MAIN PANEL) ---
        function renderDashboardScreen() {
            const state = window.appState;
            const session = state.session;
            const canManageStatus = session.role === 'Administrador' || session.role === 'Editor';

            // Filter news
            const filteredNews = state.news.filter(n => {
                if (state.filters.media && String(n.mediaId) !== String(state.filters.media)) return false;
                if (state.filters.status && n.status !== state.filters.status) return false;
                if (state.filters.priority && n.mediaPriority !== state.filters.priority) return false;
                if (state.filters.search) {
                    const q = state.filters.search.toLowerCase();
                    const matchTitle = (n.title || '').toLowerCase().includes(q);
                    const matchContent = (n.content || '').toLowerCase().includes(q);
                    if (!matchTitle && !matchContent) return false;
                }
                return true;
            });

            // Pagination calculation
            const totalPages = Math.ceil(filteredNews.length / state.itemsPerPage) || 1;
            if (state.currentPage > totalPages) state.currentPage = totalPages;
            const startIdx = (state.currentPage - 1) * state.itemsPerPage;
            const pageNews = filteredNews.slice(startIdx, startIdx + state.itemsPerPage);

            return `
                ${renderNavbar()}

                <main class="max-w-7xl w-full mx-auto p-6 space-y-6 flex-1">
                    
                    <!-- Filters Section -->
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Filtrar por Medio</label>
                            <select id="filter-media" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-argBlue">
                                <option value="">Todos los medios</option>
                                ${state.media.map(m => `<option value="${m.id}" ${state.filters.media == m.id ? 'selected' : ''}>${m.name} (${m.origin})</option>`).join('')}
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Estado de Noticia</label>

        function bindDashboardEvents() {
            const state = window.appState;

            document.getElementById('filter-media').addEventListener('change', (e) => {
                state.filters.media = e.target.value;
                state.currentPage = 1;
                renderApp();
            });

            document.getElementById('filter-status').addEventListener('change', (e) => {
                state.filters.status = e.target.value;
                state.currentPage = 1;
                renderApp();
            });

            document.getElementById('filter-priority').addEventListener('change', (e) => {
                state.filters.priority = e.target.value;
                state.currentPage = 1;
                renderApp();
            });

            // Smooth word-by-word search without losing focus
            const searchInput = document.getElementById('filter-search');
            searchInput.addEventListener('input', (e) => {
                state.filters.search = e.target.value;
                state.currentPage = 1;
                
                // Perform silent re-render maintaining search input cursor
                const selStart = e.target.selectionStart;
                const selEnd = e.target.selectionEnd;
                renderApp();
                const newSearchInput = document.getElementById('filter-search');
                if (newSearchInput) {
                    newSearchInput.focus();
                    newSearchInput.setSelectionRange(selStart, selEnd);
                }
            });
        }

        window.resetDashboardFilters = function() {
            window.appState.filters = { media: '', status: '', priority: '', search: '' };
            window.appState.currentPage = 1;
            renderApp();
        };

        window.toggleExpandRow = function(id) {
            window.appState.expandedRowId = window.appState.expandedRowId === id ? null : id;
            renderApp();
        };

        window.changeDashboardPage = function(p) {
            window.appState.currentPage = p;
            renderApp();
        };

        window.publishNewsItem = async function(id) {
            const item = window.appState.news.find(n => String(n.id) === String(id));
            if (item) {
                item.status = 'Publicado';
                await window.saveItemCloud('news', item);
                showToast('Publicado correctamente', 'success');
                renderApp();
            }
        };

        window.rejectNewsItem = async function(id) {
            await window.deleteItemCloud('news', id);
            showToast('Rechazado correctamente', 'rejected');
            renderApp();
        };

        window.saveEditedNewsItem = async function(id) {
            const title = document.getElementById(`edit-title-${id}`).value.trim();
            const mediaId = document.getElementById(`edit-media-${id}`).value;
            const link = document.getElementById(`edit-link-${id}`).value.trim();
            const content = document.getElementById(`edit-content-${id}`).value.trim();

            if (!title || !link || !content) {
                showToast('Complete todos los campos requeridos', 'error');
                return;
            }

            const selectedMedia = window.appState.media.find(m => String(m.id) === String(mediaId));
            const item = window.appState.news.find(n => String(n.id) === String(id));

            if (item && selectedMedia) {
                item.title = title;
                item.mediaId = selectedMedia.id;
                item.mediaName = selectedMedia.name;
                item.mediaPriority = selectedMedia.priority;
                item.link = link;
                item.content = content;

                await window.saveItemCloud('news', item);
                showToast('Noticia actualizada correctamente', 'success');
                window.appState.expandedRowId = null;
                renderApp();
            }
        };

        let tempCreateNoteImgBase64 = '';
        let tempCreateNoteDocName = '';

        function bindCreateNoteEvents() {
            tempCreateNoteImgBase64 = '';
            tempCreateNoteDocName = '';
            const state = window.appState;

            const mediaSearchInput = document.getElementById('note-media-search');
            
            mediaSearchInput.addEventListener('focus', () => {
                state.isMediaDropdownOpen = true;
                renderApp();
                const inp = document.getElementById('note-media-search');
                if (inp) inp.focus();
            });

            mediaSearchInput.addEventListener('input', (e) => {
                state.mediaSelectQuery = e.target.value;
                state.isMediaDropdownOpen = true;
                const selStart = e.target.selectionStart;
                renderApp();
                const inp = document.getElementById('note-media-search');
                if (inp) {
                    inp.focus();
                    inp.setSelectionRange(selStart, selStart);
                }
            });

            document.getElementById('note-image-file').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        tempCreateNoteImgBase64 = evt.target.result;
                        document.getElementById('note-img-preview').src = tempCreateNoteImgBase64;
                        document.getElementById('note-img-preview-container').classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('note-doc-file').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    tempCreateNoteDocName = file.name;
                    document.getElementById('doc-file-name').textContent = file.name;
                    document.getElementById('note-doc-info').classList.remove('hidden');
                }
            });

            document.getElementById('create-note-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const mediaId = document.getElementById('selected-media-id').value;
                const date = document.getElementById('note-date').value;
                const time = document.getElementById('note-time').value;
                const title = document.getElementById('note-title').value.trim();
                const link = document.getElementById('note-link').value.trim();
                const content = document.getElementById('note-content').value.trim();

                if (!mediaId) {
                    showToast('Por favor seleccione un medio de la lista desplegable', 'error');
                    return;
                }

                const selectedMedia = state.media.find(m => String(m.id) === String(mediaId));

                const newNote = {
                    id: `note-${Date.now()}`,
                    date,
                    time,
                    mediaId: selectedMedia.id,
                    mediaName: selectedMedia.name,
                    mediaPriority: selectedMedia.priority,
                    title,
                    link,
                    content: tempCreateNoteDocName ? `${content}\n\n[Documento Adjunto: ${tempCreateNoteDocName}]` : content,
                    image: tempCreateNoteImgBase64,
                    author: state.session.username,
                    status: 'Pendiente'
                };

                await window.saveItemCloud('news', newNote);
                showToast('Noticia cargada correctamente', 'success');
                navigateTo('dashboard');
            });
        }

        window.selectMediaOption = function(id, name) {

            window.appState.isMediaDropdownOpen = false;
            renderApp();
            document.getElementById('selected-media-id').value = id;
            document.getElementById('note-media-search').value = name;
        };

        let tempMediaLogoBase64 = 'https://placehold.co/100x100/0077B6/ffffff?text=LOGO';

        function bindCreateMediaEvents() {
            const state = window.appState;

            const searchInput = document.getElementById('search-media-input');
            searchInput.addEventListener('input', (e) => {
                state.mediaSearchQuery = e.target.value;
                const selStart = e.target.selectionStart;
                renderApp();
                const inp = document.getElementById('search-media-input');
                if (inp) {
                    inp.focus();
                    inp.setSelectionRange(selStart, selStart);
                }
            });

            document.getElementById('media-logo-file').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = 150;
                            canvas.height = 150;
                            ctx.drawImage(img, 0, 0, 150, 150);
                            tempMediaLogoBase64 = canvas.toDataURL('image/jpeg', 0.85);

                            document.getElementById('preview-img-tag').src = tempMediaLogoBase64;
                            document.getElementById('media-logo-preview').classList.remove('hidden');
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('create-media-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('media-name').value.trim();
                const type = document.getElementById('media-type').value;
                const origin = document.getElementById('media-origin').value.trim();
                const priority = document.getElementById('media-priority').value;

                // Validation against duplicate media name
                const exists = state.media.some(m => m.name.toLowerCase() === name.toLowerCase());
                if (exists) {
                    showToast(`El medio "${name}" ya existe registrado en el sistema`, 'error');
                    return;
                }

                const newMedia = {
                    id: `media-${Date.now()}`,
                    name,
                    type,
                    origin,
                    priority,
                    logo: tempMediaLogoBase64
                };

                await window.saveItemCloud('media', newMedia);
                showToast('Medio creado correctamente', 'success');
                tempMediaLogoBase64 = 'https://placehold.co/100x100/0077B6/ffffff?text=LOGO';
                renderApp();
            });
        }

                const role = document.getElementById('user-role').value;

                    showToast(`El usuario "${username}" ya existe. Por favor elija otro.`, 'error');

                const newUser = {

                    role,

        function renderEditUserScreen() {
            const state = window.appState;
            const targetUser = state.users.find(u => String(u.id) === String(state.editingUserId));

            if (!targetUser) {
                return `<div class="p-8 text-center">Usuario no encontrado. <button onclick="navigateTo('manage_users')">Volver</button></div>`;
            }

            return `
                ${renderNavbar()}

                        <div class="mb-6 pb-4 border-b border-slate-200">

                        </div>

                        <form id="edit-user-form" class="space-y-5">

                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nombre Completo</label>

                                    <option value="Editor" ${targetUser.role === 'Editor' ? 'selected' : ''}>Editor</option>
                                    <option value="Auditor" ${targetUser.role === 'Auditor' ? 'selected' : ''}>Auditor</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                                <input type="text" id="edit-password" value="${targetUser.pass}" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-argBlue">
                            </div>

                            <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                                <button type="button" onclick="deleteUser('${targetUser.id}')" class="px-4 py-2.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold rounded-xl text-sm transition">
                                    <i class="fa-solid fa-trash mr-1"></i> Eliminar Usuario

                                    <button type="button" onclick="navigateTo('manage_users')" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">

                                    </button>

        function bindEditUserEvents() {
            document.getElementById('edit-user-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const state = window.appState;
                const targetUser = state.users.find(u => String(u.id) === String(state.editingUserId));

                const name = document.getElementById('edit-fullname').value.trim();
                const username = document.getElementById('edit-username').value.trim();
                const role = document.getElementById('edit-role').value;
                const pass = document.getElementById('edit-password').value.trim();

                // Duplicate check excluding self
                const exists = state.users.some(u => String(u.id) !== String(targetUser.id) && u.username.toLowerCase() === username.toLowerCase());
                if (exists) {
                    showToast(`El nombre de usuario "${username}" ya está en uso.`, 'error');
                    return;
                }

                targetUser.name = name;
                targetUser.username = username;
                targetUser.role = role;
                targetUser.pass = pass;

                await window.saveItemCloud('users', targetUser);
                showToast('Usuario actualizado correctamente', 'success');
                navigateTo('manage_users');
            });
        }

        window.deleteUser = async function(id) {
            const state = window.appState;
            if (state.users.length <= 1) {
                showToast('No puede eliminar el único usuario del sistema', 'error');
                return;
            }
            await window.deleteItemCloud('users', id);
            showToast('Usuario eliminado correctamente', 'info');
            navigateTo('manage_users');
        };

        // Initialize application render on window load
        window.addEventListener('load', () => {
            renderApp();
        });
    </script>
